name: deploy-production

on:
  push:
    branches: [prod]
  workflow_dispatch:
    inputs:
      deploy_scope:
        description: Stacks to deploy.
        required: true
        type: choice
        default: frontend
        options:
          - frontend
          - admin-prerequisites
          - admin
          - billing-prerequisites
          - referrals-prerequisites
          - referrals
          - all

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  guard-ref:
    name: Require prod branch
    runs-on: ubuntu-latest
    steps:
      - name: Show dispatch ref
        run: |
          echo "Event: ${GITHUB_EVENT_NAME}"
          echo "Ref: ${GITHUB_REF}"
          echo "Ref name: ${GITHUB_REF_NAME}"
          echo "SHA: ${GITHUB_SHA}"

      - name: Reject non-prod dispatch
        if: github.ref != 'refs/heads/prod'
        run: |
          echo "::error::Production deployment must run from refs/heads/prod."
          echo "::error::This run is using ${GITHUB_REF}. Start a new deploy-production workflow run and choose the prod branch; rerunning a workflow that was originally dispatched from another branch will keep the old ref."
          exit 1

      - name: Confirm production branch
        if: github.ref == 'refs/heads/prod'
        run: echo "Deploying from ${GITHUB_REF}."

  validate:
    name: Validate before production deploy
    needs: guard-ref
    uses: ./.github/workflows/_reusable-validate.yml
    permissions:
      contents: read
    with:
      cdk-environment: ${{ vars.CDK_CONTEXT_ENVIRONMENT || 'production' }}
      aws-region: ${{ vars.AWS_REGION || 'us-east-2' }}

  detect-changes:
    name: Select production stack scope
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      deploy-stacks: ${{ steps.scope.outputs.deploy-stacks }}
      cdk-extra-args: ${{ steps.scope.outputs.cdk-extra-args }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select stacks
        id: scope
        shell: bash
        run: |
          set -euo pipefail

          full_stack_list="JaleNetworkStack JaleDatabaseStack JaleAuthStack JaleAiStack JaleMatchingStack JaleApiStack JaleReferralsStack JaleBillingStack JaleLegalStack JaleWhatsAppStack JaleDocumentsStack JaleAdminCertStack JaleAdminStack JaleFrontendStack"
          frontend_stack_list="JaleFrontendStack"
          admin_prerequisites_stack_list="JaleDatabaseStack JaleAdminCertStack"
          admin_stack_list="JaleDatabaseStack JaleWhatsAppStack JaleAdminStack"
          billing_prerequisites_stack_list="JaleNetworkStack JaleDatabaseStack"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            case "${{ inputs.deploy_scope }}" in
              all)
                echo "deploy-stacks=${full_stack_list}" >> "$GITHUB_OUTPUT"
                echo "cdk-extra-args=" >> "$GITHUB_OUTPUT"
                ;;
              admin-prerequisites)
                echo "deploy-stacks=${admin_prerequisites_stack_list}" >> "$GITHUB_OUTPUT"
                echo "cdk-extra-args=--exclusively" >> "$GITHUB_OUTPUT"
                ;;
              billing-prerequisites)
                echo "deploy-stacks=${billing_prerequisites_stack_list}" >> "$GITHUB_OUTPUT"
                echo "cdk-extra-args=--exclusively" >> "$GITHUB_OUTPUT"
                ;;
              referrals-prerequisites)
                # Network + Database only -- creates jale/referrals/db and the
                # visitor-salt secrets so the bastion password sync can read
                # them, WITHOUT deploying any route. Same stacks as
                # billing-prerequisites; named so the referral runbook does not
                # require tribal knowledge to trust the step.
                echo "deploy-stacks=${billing_prerequisites_stack_list}" >> "$GITHUB_OUTPUT"
                echo "cdk-extra-args=--exclusively" >> "$GITHUB_OUTPUT"
                ;;
              referrals)
                # DatabaseStack owns the jale/referrals/db + visitor-salt secrets
                # (the bastion password sync needs them to exist); ApiStack and
                # ReferralsStack must deploy together because the referral routes'
                # Methods land in the ApiStack template. No --exclusively.
                echo "deploy-stacks=JaleDatabaseStack JaleApiStack JaleReferralsStack" >> "$GITHUB_OUTPUT"
                echo "cdk-extra-args=" >> "$GITHUB_OUTPUT"
                ;;
              admin)
                echo "deploy-stacks=${admin_stack_list}" >> "$GITHUB_OUTPUT"
                echo "cdk-extra-args=--exclusively" >> "$GITHUB_OUTPUT"
                ;;
              frontend)
                echo "deploy-stacks=${frontend_stack_list}" >> "$GITHUB_OUTPUT"
                echo "cdk-extra-args=--exclusively" >> "$GITHUB_OUTPUT"
                ;;
              *)
                echo "::error::Unsupported deploy scope: ${{ inputs.deploy_scope }}"
                exit 1
                ;;
            esac
            exit 0
          fi

          before="${{ github.event.before }}"
          if [[ "$before" == "0000000000000000000000000000000000000000" ]]; then
            before="$(git rev-parse "${GITHUB_SHA}^")"
          fi

          git diff --name-only "$before" "$GITHUB_SHA" | tee changed-files.txt

          if grep -q '^infra/db/migrations/' changed-files.txt; then
            echo "::error::Production deploy includes migration changes. Apply migrations through the manual migration runbook until a ledger exists."
            exit 1
          fi

          infra_deploy_changes="$(grep '^infra/' changed-files.txt | grep -Ev '^infra/package(-lock)?\.json$' || true)"
          if [[ -n "$infra_deploy_changes" ]]; then
            echo "deploy-stacks=${full_stack_list}" >> "$GITHUB_OUTPUT"
            echo "cdk-extra-args=" >> "$GITHUB_OUTPUT"
          else
            echo "deploy-stacks=${frontend_stack_list}" >> "$GITHUB_OUTPUT"
            echo "cdk-extra-args=--exclusively" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload changed file list
        uses: actions/upload-artifact@v4
        with:
          name: production-changed-files
          path: changed-files.txt
          if-no-files-found: ignore

  deploy:
    name: Deploy production
    needs:
      - validate
      - detect-changes
    uses: ./.github/workflows/_reusable-deploy.yml
    permissions:
      contents: read
      id-token: write
    secrets: inherit
    with:
      github-environment: production
      aws-region: ${{ vars.AWS_REGION || 'us-east-2' }}
      cdk-environment: ${{ vars.CDK_CONTEXT_ENVIRONMENT || 'production' }}
      deploy-stacks: ${{ needs.detect-changes.outputs.deploy-stacks }}
      cdk-extra-args: ${{ needs.detect-changes.outputs.cdk-extra-args }}
