name: reusable-validate

on:
  workflow_call:
    inputs:
      cdk-environment:
        description: CDK context environment value.
        required: false
        type: string
        default: dev
      aws-region:
        description: Region used for deterministic CDK synth.
        required: false
        type: string
        default: us-east-2
      production-synth:
        description: Also synthesize the backend with environment=production, from fixed dummy context only (no vars, secrets or inputs).
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  workflow-guard:
    name: Workflow guardrails
    runs-on: ubuntu-latest
    # Normal runtime is ~10-12s; 20 minutes leaves headroom without letting a
    # hang burn the shared 360-minute ceiling.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Validate GitHub workflow contract
        run: node scripts/validate-github-workflows.mjs

  scripts:
    name: Script syntax
    runs-on: ubuntu-latest
    # Normal runtime is ~10-20s; 20 minutes leaves headroom without letting a
    # hang burn the shared 360-minute ceiling.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate shell scripts
        shell: bash
        # One `bash -n` per file: given several files, bash checks only the
        # first and passes the rest to it as arguments, so a broken second
        # script would still exit 0. The workflow guardrails enforce this.
        run: |
          set -euo pipefail
          mapfile -t scripts < <(find . -name '*.sh' -not -path '*/node_modules/*' -not -path './.git/*' -not -path '*/cdk.out/*' | sort)
          if [ "${#scripts[@]}" -eq 0 ]; then
            echo "::error::no shell scripts found; the file list is broken"
            exit 1
          fi
          status=0
          for f in "${scripts[@]}"; do
            if bash -n "$f"; then
              echo "ok: $f"
            else
              echo "::error file=$f::bash -n failed"
              status=1
            fi
          done
          exit "$status"

      - name: Run script self-tests
        shell: bash
        # `node --test` over scripts/*.test.mjs: the audit gate's decision logic
        # (expiry re-arming, malformed exception files) is what these prove.
        run: |
          set -euo pipefail
          shopt -s nullglob
          tests=(scripts/*.test.mjs)
          if (( ${#tests[@]} > 0 )); then
            node --test "${tests[@]}"
          fi

      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          $parseErrors = @()
          Get-ChildItem scripts -Filter *.ps1 | ForEach-Object {
            $errors = $null
            $null = [System.Management.Automation.PSParser]::Tokenize((Get-Content -Raw $_.FullName), [ref]$errors)
            if ($errors) {
              $parseErrors += $errors
            }
          }
          if ($parseErrors.Count -gt 0) {
            $parseErrors | Format-List
            exit 1
          }

  infra:
    name: Infra build, test, synth
    runs-on: ubuntu-latest
    # Measured under Node 24 (October 2026): the job takes 25-28 minutes on
    # most runners and 45-47 minutes on slower ones, where every step (build,
    # the in-band unit tests, synth) runs about 1.6 times longer on the same
    # commit. 60 minutes covers the slower runners with room for the suite to
    # grow; re-measure if runs approach it.
    timeout-minutes: 60
    env:
      CDK_DEFAULT_ACCOUNT: '111111111111'
      CDK_DEFAULT_REGION: ${{ inputs.aws-region }}
      # Scoped to this job only (not workflow-level): the security job below
      # runs `npm audit --audit-level=high` as an explicit gate and must keep
      # hitting the audit endpoint. Here we only want the *incidental*
      # audit/funding calls npm ci makes in the setup step skipped -- CDK
      # bundling no longer shells out to npm at all, so this only ever
      # affected that one install.
      NPM_CONFIG_AUDIT: 'false'
      NPM_CONFIG_FUND: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup infra dependencies
        uses: ./.github/actions/setup-node-cache
        with:
          working-directory: infra

      - name: Build infra TypeScript
        working-directory: infra
        run: npm run build

      - name: Run infra unit tests
        working-directory: infra
        # test:ci is plain `jest` — the default `test` script carries
        # --maxWorkers=2 (a dev-host OOM cap), and jest rejects combining
        # --maxWorkers with --runInBand in one invocation.
        run: npm run test:ci -- --runInBand

      - name: CDK synth backend stacks
        working-directory: infra
        env:
          # The CDK CLI overrides CDK_DEFAULT_REGION with the region it
          # resolves itself, which is us-east-1 with no AWS configuration, and
          # the app builds its edge stacks around the main region. As in
          # _reusable-deploy.yml, AWS_REGION comes from the region input.
          AWS_REGION: ${{ inputs.aws-region }}
        # No --all: it is not a valid `cdk synth` option (CDK 2.1133+ prints
        # "Unknown option(s): --all" and ignores it) -- `cdk synth` with no
        # stack argument already synthesizes every stack.
        run: npx cdk synth -c environment=${{ inputs.cdk-environment }} -c skipFrontend=true -c emailFromAddress=ci-synth@jaleapp.ai -c sesVerifiedIdentityArn=arn:aws:ses:${{ inputs.aws-region }}:111111111111:identity/jaleapp.ai -c sesEmailFromAddress=ci-synth@jaleapp.ai -c sesEmailRegion=us-east-1 -c whatsappStatusCallbackUrl=https://api.example.invalid/whatsapp/status-callback -c whatsappAlarmTopicArn=arn:aws:sns:${{ inputs.aws-region }}:111111111111:jale-ci-whatsapp-alarms -c billingAlarmTopicArn=arn:aws:sns:${{ inputs.aws-region }}:111111111111:jale-ci-whatsapp-alarms -c publicSiteBaseUrl=https://ci-synth.example.invalid -c sesConfigurationSetName=jale-ci-employer-email -c whatsappBusinessNumber=15550000000 -c guardDutyMode=create -c securityHubMode=create -c configMode=create -c dbSharedPreloadLibrariesDefault=pg_stat_statements --output "$RUNNER_TEMP/jale-cdk-synth-backend"

      - name: Upload backend synth artifact
        uses: actions/upload-artifact@v7
        with:
          name: backend-cdk-synth
          path: ${{ runner.temp }}/jale-cdk-synth-backend
          if-no-files-found: error

      # The production synth, for the callers that ask for it (pull request
      # validation). The refusals only a production synth makes (the engine's
      # preload default, the audit detection modes, the alarm topic) would
      # otherwise be met first on the prod push. It passes every context key
      # the production deploy passes, each with a fixed dummy value, and
      # reads no vars, secrets or inputs, so a pull request from a fork
      # passes too. 21 is the app's stack count without the frontend, which
      # the frontend job builds (skipFrontend): change it with the stack list.
      - name: CDK synth backend stacks (production, fixed context)
        if: ${{ inputs.production-synth }}
        working-directory: infra
        shell: bash
        env:
          AWS_REGION: us-east-2
          CDK_DEFAULT_REGION: us-east-2
          CDK_DEFAULT_ACCOUNT: '111111111111'
        run: |
          npx cdk synth -c environment=production -c skipFrontend=true -c deletionProtection=true -c emailFromAddress=ci-synth@jaleapp.ai -c sesVerifiedIdentityArn=arn:aws:ses:us-east-2:111111111111:identity/jaleapp.ai -c sesEmailFromAddress=ci-synth@jaleapp.ai -c sesEmailRegion=us-east-1 -c whatsappStatusCallbackUrl=https://api.example.invalid/whatsapp/status-callback -c whatsappAlarmTopicArn=arn:aws:sns:us-east-2:111111111111:jale-ci-whatsapp-alarms -c billingAlarmTopicArn=arn:aws:sns:us-east-2:111111111111:jale-ci-whatsapp-alarms -c whatsappInboundV2TransportEnabled=true -c publicSiteBaseUrl=https://ci-synth.example.invalid -c sesConfigurationSetName=jale-ci-employer-email -c whatsappBusinessNumber=15550000000 -c guardDutyMode=create -c securityHubMode=create -c configMode=create -c dbSharedPreloadLibrariesDefault=pg_stat_statements --output "$RUNNER_TEMP/jale-cdk-synth-production"
          templates=$(find "$RUNNER_TEMP/jale-cdk-synth-production" -maxdepth 1 -name '*.template.json' | wc -l)
          echo "production synth: $templates templates"
          if [ "$templates" -ne 21 ]; then
            echo "::error::The production synth wrote $templates templates; expected 21."
            exit 1
          fi

  database:
    name: Database suites (${{ matrix.profile }})
    runs-on: ubuntu-latest
    # A leg bootstraps a disposable PostgreSQL 16 test bed (every migration on
    # disk) and runs the database suites in band. 30 minutes is twice the
    # 15-minute budget a leg must stay under, without letting a hang burn the
    # shared 360-minute ceiling.
    timeout-minutes: 30
    strategy:
      # Every profile reports its own result, even when another leg fails.
      fail-fast: false
      matrix:
        profile: [standard, request, owner-unrestricted]
    env:
      NPM_CONFIG_AUDIT: 'false'
      NPM_CONFIG_FUND: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup infra dependencies
        uses: ./.github/actions/setup-node-cache
        with:
          working-directory: infra

      # bootstrap-testbed.sh starts its own postgres:16 container with the
      # runner's Docker, applies every migration on disk as jale_admin and
      # applies the profile; the runner then fails on any suite that did not
      # run, ran out of order, or did not pass every test.
      - name: Run database suites
        shell: bash
        env:
          PROFILE: ${{ matrix.profile }}
          JALE_DB_TEST_RESULTS: ${{ runner.temp }}/db-results/registered-suites.json
          JALE_DB_TEST_PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: bash infra/db/local/bootstrap-testbed.sh --ephemeral --ref none --profile "$PROFILE" -- bash infra/scripts/run-whatsapp-v2-db-tests.sh

      # The clean-apply suites each need a cluster of their own, so they run
      # alone on fresh beds, under the same results check. Those beds take the
      # standard profile only.
      - name: Run migration apply-order suite (empty cluster)
        if: ${{ !cancelled() && matrix.profile == 'standard' }}
        shell: bash
        env:
          JALE_DB_TEST_RESULTS: ${{ runner.temp }}/db-results/apply-order.json
          JALE_DB_TEST_PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: bash infra/db/local/bootstrap-testbed.sh --ephemeral --ref none --empty -- bash infra/scripts/run-whatsapp-v2-db-tests.sh --suite test/unit/db/migrations/apply-order.test.ts

      - name: Run billing upgrade suite (bare cluster)
        if: ${{ !cancelled() && matrix.profile == 'standard' }}
        shell: bash
        env:
          JALE_DB_TEST_RESULTS: ${{ runner.temp }}/db-results/billing-034-upgrade.json
          JALE_DB_TEST_PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: bash infra/db/local/bootstrap-testbed.sh --ephemeral --ref none --bare --url-var JALE_TEST_UPGRADE_DATABASE_URL -- bash infra/scripts/run-whatsapp-v2-db-tests.sh --suite test/unit/db/migrations/billing-034-upgrade.test.ts

      - name: Run employer organizations upgrade suite (bare cluster)
        if: ${{ !cancelled() && matrix.profile == 'standard' }}
        shell: bash
        env:
          JALE_DB_TEST_RESULTS: ${{ runner.temp }}/db-results/employer-organizations-118-upgrade.json
          JALE_DB_TEST_PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: bash infra/db/local/bootstrap-testbed.sh --ephemeral --ref none --bare --url-var JALE_TEST_UPGRADE_DATABASE_URL -- bash infra/scripts/run-whatsapp-v2-db-tests.sh --suite test/unit/db/migrations/employer-organizations-118-upgrade.test.ts

      - name: Run company billing upgrade suite (bare cluster)
        if: ${{ !cancelled() && matrix.profile == 'standard' }}
        shell: bash
        env:
          JALE_DB_TEST_RESULTS: ${{ runner.temp }}/db-results/company-billing-127-upgrade.json
          JALE_DB_TEST_PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: bash infra/db/local/bootstrap-testbed.sh --ephemeral --ref none --bare --url-var JALE_TEST_UPGRADE_DATABASE_URL -- bash infra/scripts/run-whatsapp-v2-db-tests.sh --suite test/unit/db/migrations/company-billing-127-upgrade.test.ts

      - name: Run migration 119 apply-order suite (bare cluster)
        if: ${{ !cancelled() && matrix.profile == 'standard' }}
        shell: bash
        env:
          JALE_DB_TEST_RESULTS: ${{ runner.temp }}/db-results/migration-119-out-of-order.json
          JALE_DB_TEST_PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: bash infra/db/local/bootstrap-testbed.sh --ephemeral --ref none --bare --url-var JALE_TEST_UPGRADE_DATABASE_URL -- bash infra/scripts/run-whatsapp-v2-db-tests.sh --suite test/unit/db/migrations/migration-119-out-of-order.test.ts

      - name: Setup admin dependencies
        if: ${{ !cancelled() && matrix.profile == 'standard' }}
        uses: ./.github/actions/setup-node-cache
        with:
          working-directory: admin

      # The admin dashboard's access records, checked on a fresh bed through
      # the dashboard's own database login. The checks need the URL the bed
      # exports, so they run only through bootstrap-testbed.sh.
      - name: Run admin access-record checks
        if: ${{ !cancelled() && matrix.profile == 'standard' }}
        shell: bash
        run: bash infra/db/local/bootstrap-testbed.sh --ephemeral --ref none --profile standard -- bash -c 'cd admin && npm run test:audit-db'

      # The dashboard's report inbox (its actions and reads against the real
      # report functions), checked the same way on a fresh bed of its own.
      - name: Run admin report checks
        if: ${{ !cancelled() && matrix.profile == 'standard' }}
        shell: bash
        run: bash infra/db/local/bootstrap-testbed.sh --ephemeral --ref none --profile standard -- bash -c 'cd admin && npm run test:report-db'

      # The summary gets the commit and the profile even when the run stopped
      # before jest wrote any results.
      - name: Record a run without results
        if: ${{ !cancelled() }}
        shell: bash
        env:
          PROFILE: ${{ matrix.profile }}
          RESULTS: ${{ runner.temp }}/db-results/registered-suites.json
        run: |
          if [ ! -s "$RESULTS" ]; then
            {
              echo "### Database suites: ${PROFILE} profile"
              echo
              echo "Commit \`$(git rev-parse HEAD)\`"
              echo
              echo "**No results:** the run stopped before jest wrote them; see the step log."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload suite results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: db-suites-${{ github.sha }}-${{ matrix.profile }}
          path: ${{ runner.temp }}/db-results
          if-no-files-found: warn

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    # Normal runtime is a few minutes (lint + typecheck + vitest run in ~15s,
    # then the Next build); 20 minutes leaves headroom without letting a hang
    # burn the shared 360-minute ceiling.
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3000/api
      NEXT_PUBLIC_WORKER_POOL_ID: us-east-1_placeholder
      NEXT_PUBLIC_WORKER_CLIENT_ID: placeholder
      NEXT_PUBLIC_EMPLOYER_POOL_ID: us-east-1_placeholder
      NEXT_PUBLIC_EMPLOYER_CLIENT_ID: placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup frontend dependencies
        uses: ./.github/actions/setup-node-cache
        with:
          working-directory: frontend

      - name: Lint frontend
        working-directory: frontend
        # Next 16's `next build` no longer runs ESLint itself, so this must
        # run as its own step.
        run: npm run lint

      - name: Typecheck frontend
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Test frontend
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  admin:
    name: Admin build and contract checks
    runs-on: ubuntu-latest
    # Normal runtime is ~1-1.5 min; 20 minutes leaves headroom without letting
    # a hang burn the shared 360-minute ceiling.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup admin dependencies
        uses: ./.github/actions/setup-node-cache
        with:
          working-directory: admin

      - name: Build admin
        # Runs before typecheck: Next generates `.next/types` during build,
        # which the typecheck now references (tsc also passes without it,
        # but this matches Next's own tsc pass ordering).
        working-directory: admin
        run: npm run build

      - name: Typecheck admin
        working-directory: admin
        run: npm run typecheck

      - name: Check admin server contracts
        working-directory: admin
        run: |
          npm run test:policy
          npm run test:server-db
          npm run test:session
          npm run test:session-store
          npm run test:read-models
          npm run test:analytics
          npm run test:charts
          npm run test:dispatch
          npm run test:safe-redirect
          npm run test:ui
          npm run test:mfa

  security:
    name: Security checks
    runs-on: ubuntu-latest
    # Normal runtime is under 1 min; 20 minutes leaves headroom without
    # letting a hang burn the shared 360-minute ceiling. This job keeps the
    # real `npm audit` gate (no NPM_CONFIG_AUDIT override here) and is
    # unaffected by the infra job's audit-skip env, which is scoped locally.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Scan tracked files for obvious secrets
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -E '(AWS_SECRET_ACCESS_KEY\s*=|aws_secret_access_key\s*=|TWILIO_AUTH_TOKEN\s*=|ANTHROPIC_API_KEY\s*=|-----BEGIN [A-Z ]*PRIVATE KEY-----)' -- . ':!package-lock.json' ':!frontend/package-lock.json' ':!infra/package-lock.json'; then
            echo "::error::Potential secret found in tracked files."
            exit 1
          fi

      - name: Setup infra dependencies
        uses: ./.github/actions/setup-node-cache
        with:
          working-directory: infra

      - name: Audit infra dependencies
        working-directory: infra
        # Full dependency tree (dev + prod) at high: the xlsx devDependency
        # that previously forced --omit=dev (the offline OEWS seed
        # generator's GHSA-4r6h-8v6p-xvw6, no npm fix published) is gone.
        run: npm audit --audit-level=high

      - name: Setup frontend dependencies
        uses: ./.github/actions/setup-node-cache
        with:
          working-directory: frontend

      - name: Audit frontend dependencies
        working-directory: frontend
        # Critical-level gate through scripts/npm-audit-gate.mjs, which honours
        # the DATED exception list in .github/audit-exceptions.json. Both apps
        # are on Next 16.3.8; the exceptions list is
        # currently empty, so this is a plain critical-level gate with the
        # dated-exception mechanism kept in reserve for the next unfixable
        # advisory.
        run: node ../scripts/npm-audit-gate.mjs --level critical

      - name: Setup admin dependencies
        uses: ./.github/actions/setup-node-cache
        with:
          working-directory: admin

      - name: Audit admin dependencies
        working-directory: admin
        # Same gate as the frontend; see the comment there.
        run: node ../scripts/npm-audit-gate.mjs --level critical
