name: reusable-validate

on:
  workflow_call:
    inputs:
      cdk-environment:
        description: CDK context environment value.
        required: false
        type: string
        default: dev
      aws-region:
        description: Region used for deterministic CDK synth.
        required: false
        type: string
        default: us-east-2

permissions:
  contents: read

jobs:
  workflow-guard:
    name: Workflow guardrails
    runs-on: ubuntu-latest
    # Normal runtime is ~10-12s; 20 minutes leaves headroom without letting a
    # hang burn the shared 360-minute ceiling.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Validate GitHub workflow contract
        run: node scripts/validate-github-workflows.mjs

  scripts:
    name: Script syntax
    runs-on: ubuntu-latest
    # Normal runtime is ~10-20s; 20 minutes leaves headroom without letting a
    # hang burn the shared 360-minute ceiling.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate shell scripts
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          scripts=(scripts/*.sh)
          if (( ${#scripts[@]} > 0 )); then
            bash -n "${scripts[@]}"
          fi

      - name: Run script self-tests
        shell: bash
        # `node --test` over scripts/*.test.mjs: the audit gate's decision logic
        # (expiry re-arming, malformed exception files) is what these prove.
        run: |
          set -euo pipefail
          shopt -s nullglob
          tests=(scripts/*.test.mjs)
          if (( ${#tests[@]} > 0 )); then
            node --test "${tests[@]}"
          fi

      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          $parseErrors = @()
          Get-ChildItem scripts -Filter *.ps1 | ForEach-Object {
            $errors = $null
            $null = [System.Management.Automation.PSParser]::Tokenize((Get-Content -Raw $_.FullName), [ref]$errors)
            if ($errors) {
              $parseErrors += $errors
            }
          }
          if ($parseErrors.Count -gt 0) {
            $parseErrors | Format-List
            exit 1
          }

  infra:
    name: Infra build, test, synth
    runs-on: ubuntu-latest
    # Observed runtime is ~16-24 min (npm run test:ci --runInBand shells out to
    # `npm install` ~25 times for NodejsFunction bundling, then CDK synth); 45
    # minutes gives ~2x headroom over the worst run seen while still failing
    # well short of GitHub's 360-minute ceiling if npm's audit endpoint (or
    # anything else) stalls those installs.
    timeout-minutes: 45
    env:
      CDK_DEFAULT_ACCOUNT: '111111111111'
      CDK_DEFAULT_REGION: ${{ inputs.aws-region }}
      # Scoped to this job only (not workflow-level): the security job below
      # runs `npm audit --omit=dev --audit-level=high` as an explicit gate and
      # must keep hitting the audit endpoint. Here we only want the *incidental*
      # audit/funding calls that npm makes on every install skipped -- npm ci in
      # the setup step, and more importantly the ~25 npm installs CDK's
      # NodejsFunction bundling shells out to during jest and synth, which
      # otherwise each stall 5-7 min when npm's audit endpoint is degraded.
      NPM_CONFIG_AUDIT: 'false'
      NPM_CONFIG_FUND: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup infra dependencies
        uses: ./.github/actions/setup-node-cache
        with:
          working-directory: infra

      - name: Build infra TypeScript
        working-directory: infra
        run: npm run build

      - name: Run infra unit tests
        working-directory: infra
        # test:ci is plain `jest` — the default `test` script carries
        # --maxWorkers=2 (a dev-host OOM cap), and jest rejects combining
        # --maxWorkers with --runInBand in one invocation.
        # NPM_CONFIG_PREFER_OFFLINE: the NodejsFunction bundling this step
        # triggers reinstalls the same Lambda dependency sets repeatedly;
        # prefer the runner's npm cache over hitting the registry when a
        # satisfying copy is already there.
        env:
          NPM_CONFIG_PREFER_OFFLINE: 'true'
        run: npm run test:ci -- --runInBand

      - name: CDK synth backend stacks
        working-directory: infra
        env:
          NPM_CONFIG_PREFER_OFFLINE: 'true'
        run: npx cdk synth --all -c environment=${{ inputs.cdk-environment }} -c skipFrontend=true -c emailFromAddress=ci-synth@jaleapp.ai -c sesVerifiedIdentityArn=arn:aws:ses:${{ inputs.aws-region }}:111111111111:identity/jaleapp.ai -c sesEmailFromAddress=ci-synth@jaleapp.ai -c sesEmailRegion=us-east-1 -c whatsappStatusCallbackUrl=https://api.example.invalid/whatsapp/status-callback -c whatsappAlarmTopicArn=arn:aws:sns:${{ inputs.aws-region }}:111111111111:jale-ci-whatsapp-alarms -c billingAlarmTopicArn=arn:aws:sns:${{ inputs.aws-region }}:111111111111:jale-ci-whatsapp-alarms -c publicSiteBaseUrl=https://ci-synth.example.invalid -c sesConfigurationSetName=jale-ci-employer-email -c whatsappBusinessNumber=15550000000 --output "$RUNNER_TEMP/jale-cdk-synth-backend"

      - name: Upload backend synth artifact
        uses: actions/upload-artifact@v7
        with:
          name: backend-cdk-synth
          path: ${{ runner.temp }}/jale-cdk-synth-backend
          if-no-files-found: error

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    # Normal runtime is a few minutes (lint + typecheck + vitest run in ~15s,
    # then the Next build); 20 minutes leaves headroom without letting a hang
    # burn the shared 360-minute ceiling.
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3000/api
      NEXT_PUBLIC_WORKER_POOL_ID: us-east-1_placeholder
      NEXT_PUBLIC_WORKER_CLIENT_ID: placeholder
      NEXT_PUBLIC_EMPLOYER_POOL_ID: us-east-1_placeholder
      NEXT_PUBLIC_EMPLOYER_CLIENT_ID: placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup frontend dependencies
        uses: ./.github/actions/setup-node-cache
        with:
          working-directory: frontend

      - name: Lint frontend
        working-directory: frontend
        # Next 16's `next build` no longer runs ESLint itself, so this must
        # run as its own step.
        run: npm run lint

      - name: Typecheck frontend
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Test frontend
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  admin:
    name: Admin build and contract checks
    runs-on: ubuntu-latest
    # Normal runtime is ~1-1.5 min; 20 minutes leaves headroom without letting
    # a hang burn the shared 360-minute ceiling.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup admin dependencies
        uses: ./.github/actions/setup-node-cache
        with:
          working-directory: admin

      - name: Build admin
        # Runs before typecheck: Next generates `.next/types` during build,
        # which the typecheck now references (tsc also passes without it,
        # but this matches Next's own tsc pass ordering).
        working-directory: admin
        run: npm run build

      - name: Typecheck admin
        working-directory: admin
        run: npm run typecheck

      - name: Check admin server contracts
        working-directory: admin
        run: |
          npm run test:policy
          npm run test:server-db
          npm run test:session
          npm run test:session-store
          npm run test:read-models
          npm run test:analytics
          npm run test:charts
          npm run test:dispatch
          npm run test:safe-redirect
          npm run test:ui
          npm run test:mfa

  security:
    name: Security checks
    runs-on: ubuntu-latest
    # Normal runtime is under 1 min; 20 minutes leaves headroom without
    # letting a hang burn the shared 360-minute ceiling. This job keeps the
    # real `npm audit` gate (no NPM_CONFIG_AUDIT override here) and is
    # unaffected by the infra job's audit-skip env, which is scoped locally.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Scan tracked files for obvious secrets
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -E '(AWS_SECRET_ACCESS_KEY\s*=|aws_secret_access_key\s*=|TWILIO_AUTH_TOKEN\s*=|ANTHROPIC_API_KEY\s*=|-----BEGIN [A-Z ]*PRIVATE KEY-----)' -- . ':!package-lock.json' ':!frontend/package-lock.json' ':!infra/package-lock.json'; then
            echo "::error::Potential secret found in tracked files."
            exit 1
          fi

      - name: Setup infra dependencies
        uses: ./.github/actions/setup-node-cache
        with:
          working-directory: infra

      - name: Audit infra dependencies
        working-directory: infra
        # --omit=dev: dev-only tooling (e.g. the offline OEWS seed generator's
        # xlsx devDependency, GHSA-4r6h-8v6p-xvw6 with no npm fix published)
        # must not block CI; shipped dependencies stay audited at high.
        run: npm audit --omit=dev --audit-level=high

      - name: Setup frontend dependencies
        uses: ./.github/actions/setup-node-cache
        with:
          working-directory: frontend

      - name: Audit frontend dependencies
        working-directory: frontend
        # Critical-level gate through scripts/npm-audit-gate.mjs, which honours
        # the DATED exception list in .github/audit-exceptions.json: Next.js 14
        # has no fix for its two critical advisories (15.5.24 is a major
        # upgrade), and neither is reachable in this deployment -- the reasons
        # are in that file, and each exception expires. The gate stays at
        # critical for everything else. TODO: upgrade Next.js to 15.x (follow-up
        # F33), then delete the exceptions.
        run: node ../scripts/npm-audit-gate.mjs --level critical

      - name: Setup admin dependencies
        uses: ./.github/actions/setup-node-cache
        with:
          working-directory: admin

      - name: Audit admin dependencies
        working-directory: admin
        # Same gate and the same two dated Next.js exceptions as the frontend.
        run: node ../scripts/npm-audit-gate.mjs --level critical
